function week(m,s){let d=0,p=0,w=0,h=0;for(let i=0;i<7;i++){const l=S.logs[m.id+'_'+day(i)];if(!l)continue;if(l.w||(l.meals||[]).length||(l.ex||[]).length)d++;if(tot(l).p>=s.pro*.9)p++;if((l.ex||[]).length)w++;if((l.water||0)>=6)h++}const sc=Math.round((d*3+p*3+w*2.5+h*1.5)/70*100);return{d,p,w,h,sc,g:sc>=85?'A':sc>=70?'B':sc>=55?'C':sc>=40?'D':'F'}}
function insights(m,s){const wk=week(m,s),B=[[s.st>=3,'🔥 3-day streak'],[s.st>=7,'⚡ 7-day streak'],[s.st>=30,'👑 30-day streak'],[s.lost>=1,'🎯 First kg'],[s.lost>=5,'🏆 5 kg'],[s.tw>=10,'💪 10 exercises'],[s.tw>=50,'🦾 50 exercises'],[s.L.length>=14,'📝 14 logs']];
 return`<div class="card"><h3>🧠 AI insights for ${m.name}</h3><p>Weekly grade: <b style="font-size:30px">${wk.g}</b> <span class="mu">(${wk.sc}/100)</span></p><p class="mu">Protein goal hit ${wk.p}/7 days · ${wk.w} workouts · water 6+ glasses ${wk.h}/7 days</p><p>Estimated body fat: <b>${s.bf.toFixed(0)}%</b> <span class="mu">(rough estimate)</span></p><p>${s.real?`Your real maintenance: <b>${s.real} kcal</b>, learned from your food and weight logs.`:'Log weight and food for 7 days to unlock your real maintenance calories.'}</p></div><div class="card"><h3>🏅 Badges · Level ${s.lv}</h3><div class="row" style="margin-top:8px">${B.map(b=>`<span class="pill ${b[0]?'ok':''}" style="opacity:${b[0]?1:.45}">${b[1]}</span>`).join('')}</div></div>`}
function coach(m){const s=stats(m),l=getLog(m.id,today()),t=tot(l),T=[],a=+m.age,wk=week(m,s);
 T.push(`${s.G[0]} Goal: <b>${s.G[1]}</b>. ${GT[s.gk]} Daily target: ${s.cal} kcal, ${s.pro} g protein.`);
 if(s.kid)T.push('🧒 For children we focus on healthy food and play, not weight loss. Please talk to your child’s doctor.');
 else if(s.b>=25&&s.G[2]>0)T.push('⚠️ Your BMI is high for a bulk. A Cut or Recomp may suit you better. Change it in Family > Edit.');
 else if(s.b<18.5&&s.G[2]<=0)T.push('Your BMI is low. A Lean bulk may suit you better. I kept your calories at maintenance.');
 if(a>=14&&a<18&&s.G[2]<0)T.push('🧑 Teen note: I use a gentle deficit for your age. Please talk to your doctor before aggressive dieting.');
 const W=s.W.filter(x=>x.date>=day(14));
 if(W.length>=4){const d=(W[W.length-1].w-W[0].w)*s.dir;T.push(d>.3?`📈 You moved ${d.toFixed(1)} kg toward your goal in 2 weeks. Keep going!`:d<-.3?'⚠️ Your weight is moving away from your goal. Review portions and consistency this week.':'➡️ Weight is steady for 2 weeks. '+(s.dir<0?'Plateau breaker: walk 10 minutes more daily and trim one snack (about 150 kcal).':'Add 150 kcal (banana with peanut butter) and push harder in training.'))}else T.push('Log your weight daily for a week and I will analyse your trend.');
 if(s.real)T.push(`🧠 Your real maintenance is about ${s.real} kcal. Your target is ${s.cal}.`);
 T.push(`📋 This week: grade <b>${wk.g}</b>. ${wk.d} days logged, protein hit ${wk.p} days, ${wk.w} workouts.`);
 if(l.meals.length){T.push(t.p<s.pro*.6?`🥜 Protein is low today (${Math.round(t.p)}/${s.pro} g). Add dal, paneer, curd, soya chunks or sprouts.`:'💪 Protein looks good today!');const j=l.meals.filter(x=>x.junk).length;if(j)T.push(`🚫 ${j} junk item${j>1?'s':''} today. Swap with fruit or roasted chana next time.`);if(t.cal>s.cal*1.1&&s.G[2]<=0)T.push('You are over calories today. Make the next meal a light salad and dal.')}else T.push('📝 Log your meals today. Tracking alone improves results.');
 if((l.water||0)<5)T.push('💧 Drink more water. A glass before each meal reduces hunger.');
 if(!l.ex.length)T.push('🏋️ No workout yet today. Even 10 minutes counts!');
 if(a>=60)T.push('🧓 Protein and gentle strength work protect your muscles and bones. Keep a chair nearby for support.');
 if(m.sex==='F'&&a>=40)T.push('Strength work plus calcium (milk, curd, ragi) helps protect your bones.');
 if(m.sex==='M'&&a>=40)T.push('Cut salt and fried food to protect your heart. A 10 minute walk after dinner helps.');
 return T}
const KB=[[/protein/,'Vegetarian protein: soya chunks (16 g/30 g), paneer (18 g/100 g), dal, rajma, chana, tofu, curd, sprouts, milk. Add one protein item to every meal.'],[/rice|roti|chapati|carb/,'Don’t quit rice or roti. Eat smaller portions: 2 rotis or 1 cup rice, with double dal and sabzi. Choose brown rice or millet when you can.'],[/sweet|mithai|sugar|chocolate|craving/,'Cravings are normal. Try a fruit, a few dates or a small piece of jaggery after meals. Keep sweets for weekends only.'],[/plateau|stuck|not losing|stopped/,'Plateaus are normal. Sleep 7–8 hours, increase walking by 10 minutes, cut evening snacks, and be patient for 2 weeks.'],[/motivat|lazy|tired|give up|bored/,'Remember why you started: a healthy family. '+'Do just 5 minutes today. Starting is the hardest part, and the family is cheering for you!'],[/water/,'Aim for 8 glasses daily. Water before meals reduces hunger.'],[/sleep/,'Poor sleep increases hunger. Aim for 7–8 hours and avoid phone 30 minutes before bed.'],[/breakfast/,'Healthy breakfast: besan chilla, moong sprouts, oats, idli with sambar, or poha with peanuts plus a glass of milk.'],[/snack|hungry/,'Smart snacks: roasted chana, fruit, buttermilk, 10 almonds, or a bowl of sprouts.'],[/dinner/,'Keep dinner light and early: dal, 1–2 roti, sabzi and salad. Eat 2–3 hours before sleep, then walk 10 minutes.'],[/bmi/,'BMI = weight (kg) ÷ height (m)². For Indians: 18.5–22.9 is healthy, 23–24.9 overweight, 25 or above obese.'],[/walk|exercise|workout/,'Start with a 20 minute daily walk. Then add the exercises in the Workout tab. Consistency matters more than intensity.']];
KB.unshift([/protein/,(m,s)=>`Your protein target is ${s.pro} g per day. Vegetarian sources: soya chunks (16 g per 30 g), paneer, dal, rajma, chana, tofu, curd, sprouts, milk and whey. Add one to every meal.`],[/calorie|kcal/,(m,s)=>`Your daily target is ${s.cal} kcal for ${s.G[1]}: protein ${s.pro} g, carbs ${s.carb} g, fat ${s.fat} g.`],[/bulk|gain|muscle|mass|bigger/,(m,s)=>`To build muscle: eat ${s.cal} kcal (a small surplus), ${s.pro} g protein, lift 4 to 5 days with progressive overload (add weight or reps weekly), and sleep 8 hours. Expect 0.25 to 0.4 kg per week.`],[/cut|shred|lean|fat loss|lose fat|belly/,(m,s)=>`To lose fat and keep muscle: eat ${s.cal} kcal, ${s.pro} g protein, lift heavy 3 days, walk daily. Aim for 0.5 kg per week. You cannot spot-reduce belly fat; total fat loss does it.`],[/body fat|bf/,(m,s)=>`Your estimated body fat is about ${s.bf.toFixed(0)}% (rough estimate from BMI, age and gender).`],[/what.*eat|meal plan|menu/,()=>'Open the Fuel tab and tap “Create my plan” for a full vegetarian day made for your goal.'],[/supplement|creatine|whey/,()=>'Food first. Whey protein is a convenient option if you miss your protein target. Please check with a doctor before any supplement, especially if you are over 50 or have a medical condition.']);
function vCoach(){const m=M();if(!m)return needMe();
 return`<h1>🤖 AI Coach</h1><div class="card hero"><div class="mu">Built in. Works offline. Your data stays on your device.</div><h3>Today’s advice for ${m.name}</h3></div>${coach(m).map((t,i)=>`<div class="card" style="animation-delay:${i*.1}s">${t}</div>`).join('')}
 <div class="card"><h3>Ask the coach</h3><div id="chat">${chat.map(c=>`<div class="chat ${c.u?'me':''}">${c.t}</div>`).join('')}</div><div class="row scroll" style="flex-wrap:nowrap;margin:8px 0">${['protein','sweet cravings','dinner','not losing weight','motivation'].map(x=>`<button class="chip" onclick="ask('${x}')">${x}</button>`).join('')}</div><div class="row"><input id="ci" placeholder="Type your question" style="flex:1"><button onclick="ask()">Send</button></div></div>`}
// ---------- actions ----------
function ask(x){const i=$('#ci');const q=(x||i.value).trim();if(!q)return;const hit=KB.find(k=>k[0].test(q.toLowerCase()));chat.push({u:1,t:q},{t:hit?(typeof hit[1]==='function'?hit[1](M(),stats(M())):hit[1]):'I can help with protein, food, snacks, dinner, cravings, BMI, water, sleep, exercise, plateaus and motivation. Please ask about one of these.'});draw('keep')}
function pick(id){me=id;LS.set('ff_me',id);toast('Welcome, '+S.members[id].name+'! 🎉');go('today')}
function go(t){tab=t;qi++;const a=$('#app');a.classList.remove('fx');void a.offsetWidth;a.classList.add('fx');setTimeout(()=>a.classList.remove('fx'),1000);vib();draw();scrollTo({top:0,behavior:'smooth'})}
function saveW(){const v=parseFloat($('#wt').value);if(!v||v<20||v>250)return toast('Please enter a valid weight');const l=getLog(me,today()),first=!l.w;const prev=stats(M()).cur;l.w=v;saveLog(l);if((v-prev)*stats(M()).dir>0){confetti();toast('Right direction! '+Math.abs(v-prev).toFixed(1)+' kg 🎉')}else toast(Q[Math.floor(Math.random()*Q.length)]);draw('keep')}
function water(n){const l=getLog(me,today());l.water=Math.max(0,(l.water||0)+n);saveLog(l);if(l.water===8){confetti();toast('Water goal done! 💧')}draw('keep')}
function addMeal(n){const f=FD(n),l=getLog(me,today());l.meals.push(mk(f,fq2));saveLog(l);vib();toast(f[6]?'Added. Try a lighter choice next time 🙂':'Added ✓ '+f[0]);draw('keep')}
function delMeal(i){const l=getLog(me,today());l.meals.splice(i,1);saveLog(l);draw('keep')}
const EM=['👨','👩','👴','👵','🧑','👦','👧','🧔','👱‍♀️','🦸'];
function editM(id){const m=id?S.members[id]:{e:'🙂',sex:'M',age:'',h:'',w0:'',gw:''};
 const d=document.createElement('div');d.className='modal';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div><h2>${id?'Edit':'Add'} member</h2><label>Photo / emoji</label><div class="row">${EM.map(e=>`<button class="chip ${e===m.e?'on':''}" onclick="this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));this.classList.add('on');window._e='${e}'" style="font-size:26px">${e}</button>`).join('')}</div>
 <label>Name</label><input id="fn" value="${m.name||''}"><div class="grid"><div><label>Age</label><input id="fa" type="number" inputmode="numeric" value="${m.age}"></div><div><label>Gender</label><select id="fs"><option value="M" ${m.sex==='M'?'selected':''}>Male</option><option value="F" ${m.sex==='F'?'selected':''}>Female</option></select></div><div><label>Height (cm)</label><input id="fh" type="number" inputmode="numeric" value="${m.h}"></div><div><label>Weight now (kg)</label><input id="fw" type="number" step="0.1" inputmode="decimal" value="${m.w0}"></div></div><label>Goal weight (kg)</label><input id="fg" type="number" step="0.1" inputmode="decimal" value="${m.gw}"><p class="mu">Not sure? Leave empty and we will pick a goal weight.</p>
 <label>Main goal</label><select id="fgl">${Object.entries(GOALS).map(([k,v])=>`<option value="${k}" ${(m.goal||'lose')===k?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select>
 <div class="grid"><div><label>Daily activity</label><select id="fac">${[[1.2,'Mostly sitting'],[1.375,'Light'],[1.55,'Active'],[1.725,'Very active']].map(([v,t])=>`<option value="${v}" ${+(m.act||1.375)===v?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Training level</label><select id="flv"><option value="beg">Beginner</option><option value="adv" ${m.lvl==='adv'?'selected':''}>Experienced</option></select></div><div><label>Equipment</label><select id="feq"><option value="b">None (home)</option><option value="d" ${m.eq==='d'?'selected':''}>Dumbbells</option><option value="g" ${m.eq==='g'?'selected':''}>Gym</option></select></div></div>
 <div class="row" style="margin-top:12px"><button onclick="submitM('${id||''}')">Save</button><button class="g" onclick="this.closest('.modal').remove()">Cancel</button>${id?`<button class="r" onclick="if(confirm('Remove this member and all their data?')){delMember('${id}');this.closest('.modal').remove();if(me==='${id}')me=null;draw()}">Delete</button>`:''}</div></div>`;
 window._e=m.e;document.body.appendChild(d)}
function submitM(id){const g=x=>$('#'+x).value;const n=g('fn').trim(),a=+g('fa'),h=+g('fh'),w=+g('fw');if(!n||!a||!h||!w||h<80||h>230)return toast('Please fill name, age, height and weight');
 let gw=+g('fg');if(!gw){const G=g('fgl');gw=G==='lean'||G==='bulk'?w+4:G==='lose'||G==='cut'?Math.min(w,Math.round(22.9*(h/100)**2)):w}const old=id?S.members[id]:null;
 const m={id:id||'m'+Date.now().toString(36),name:n,age:a,sex:g('fs'),h,w0:old?old.w0:w,gw,e:window._e,goal:g('fgl'),act:+g('fac'),lvl:g('flv'),eq:g('feq')};if(old&&w!==old.w0&&!logsOf(id).length)m.w0=w;
 saveMember(m);document.querySelector('.modal').remove();if(!me){me=m.id;LS.set('ff_me',me)}confetti();toast('Saved ✓ Goal: '+GOALS[m.goal][1]);draw()}
// ---------- render ----------
const NAV=[['today','🏠','Home'],['work','🏋️','Train'],['food','🥗','Fuel'],['prog','📈','Progress'],['home','👨‍👩‍👧','Family']];
function draw(keep){const y=scrollY,a=document.activeElement&&document.activeElement.id;$('#app').innerHTML=(FB&&!fam)?vSetup():{home:vHome,today:vToday,food:vFood,work:vWork,prog:vProg,coach:vCoach}[tab]();
 const n=$('#nav');if(!n.children.length)n.innerHTML=NAV.map(x=>`<button onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');
 const ix=NAV.findIndex(x=>x[0]===tab);n.style.setProperty('--i',Math.max(ix,0));n.style.setProperty('--o',ix<0?0:1);[...n.children].forEach((b,i)=>b.classList.toggle('on',i===ix));
 const m=M();$('#hd').innerHTML=`<b>💪 FitFamily</b>${m?`<button class="av2" onclick="go('home')">${m.e} ${m.name}</button>`:''}`;$('#fab').style.display=m?'grid':'none';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('.bar i[data-w]').forEach(e=>e.style.width=(+e.dataset.w||0)+'%');document.querySelectorAll('.rg').forEach(e=>e.style.strokeDashoffset=e.dataset.t);if($('#app').classList.contains('fx'))document.querySelectorAll('[data-n]').forEach(cnt)}));
 if(keep){scrollTo(0,y);if(a){const e=document.getElementById(a);if(e){e.focus();if(a==='fq')e.setSelectionRange(e.value.length,e.value.length)}}}}
function cnt(e){const t=+e.dataset.n,s=performance.now();(function f(n){const k=Math.min(1,(n-s)/900);e.textContent=Math.round(t*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(s)}
function vib(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function inj(){const st=document.createElement('style');st.textContent=[...Array(12)].map((_,i)=>`.fx>:nth-child(${i+1}){animation-delay:${i*.05}s}`).join('');document.head.appendChild(st);const a=$('#app');a.classList.add('fx');setTimeout(()=>a.classList.remove('fx'),1000);
 try{JSON.parse(LS.get('ff_cf')||'[]').forEach(x=>FOODS.push(x))}catch(e){}try{if('serviceWorker' in navigator&&/^http/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}}
async function init(){shared=!!(FB&&fam);isAdmin=!shared||LS.get('ff_admin')==='1';if(!shared){try{const d=LS.get('ff_data');if(d)S=JSON.parse(d)}catch(e){}}
 inj();draw();if(shared){pull();setInterval(pull,8000)}
 setInterval(()=>{const q=$('#quote');if(q){qi++;q.style.opacity=0;setTimeout(()=>{q.textContent='“'+Q[qi%Q.length]+'”';q.style.opacity=1},400)}},9000)}
init();
</script></body></html>
